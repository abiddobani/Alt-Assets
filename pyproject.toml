[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "altassets"
version = "0.1.0"
description = "Data connectors and deep learning research platform for alternative assets"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
# CPU wheels by default. On a GPU box install torch from the CUDA index instead,
# e.g. pip install torch --index-url https://download.pytorch.org/whl/cu124
ml = ["torch>=2.3", "numpy>=1.26"]
# Only on a machine with a running, logged-in Bloomberg Terminal (Desktop API).
bloomberg = ["blpapi"]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
altassets = "altassets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real public endpoints (run with -m live)"]
addopts = "-m 'not live'"
